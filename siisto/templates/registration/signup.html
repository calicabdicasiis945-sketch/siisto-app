<!DOCTYPE html>
<html lang="so" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siisto & Skillset - Is Diiwaangeli (Sign Up)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f0e13;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 antialiased bg-[#0f0e13]">

    <div class="w-full max-w-md space-y-6">
        
        <!-- LOGO -->
        <div class="text-center space-y-1">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-500 via-pink-500 to-rose-400 flex items-center justify-center mx-auto shadow-lg shadow-purple-500/25">
                <i class="fa-solid fa-dumbbell text-white text-xl"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Siisto</h1>
            <p class="text-xs text-purple-300 font-bold uppercase tracking-wider">AI Fitness & Pose Tracker</p>
        </div>

        <div class="bg-[#191622] border border-[#2e273f] rounded-3xl p-8 shadow-2xl space-y-6">
            <div>
                <h2 class="text-lg font-bold text-white">Sameyso Koonto Cusub</h2>
                <p class="text-xs text-[#9e9aa7]">Ku soo biir Siisto si aad u hesho tababarkaaga AI.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="bg-rose-950/40 border border-rose-800 text-rose-300 p-3 rounded-2xl text-xs font-semibold">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'signup' %}" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-bold text-purple-200 mb-1.5">Magaca (Username)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-[#736c82] text-xs"></i>
                        <input type="text" name="username" placeholder="Dooro magacaaga" required
                               class="w-full bg-[#201c2c] border border-[#2e273f] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#736c82] focus:outline-none focus:ring-2 focus:ring-purple-500 font-semibold">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-purple-200">Gmail / Email</label>
                        <button type="button" onclick="document.getElementById('emailInput').value += (document.getElementById('emailInput').value.includes('@') ? '' : '@gmail.com')" class="text-[10px] text-pink-400 hover:text-pink-300 font-mono">+@gmail.com</button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-pink-400 text-xs"></i>
                        <input type="email" id="emailInput" name="email" placeholder="tusaale@gmail.com" required
                               class="w-full bg-[#201c2c] border border-[#2e273f] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#736c82] focus:outline-none focus:ring-2 focus:ring-pink-500 font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-purple-200 mb-1.5">Furaha Sirta ah (Password)</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-[#736c82] text-xs"></i>
                        <input type="password" name="password" placeholder="Ugu yaraan 6 xaraf" required
                               class="w-full bg-[#201c2c] border border-[#2e273f] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#736c82] focus:outline-none focus:ring-2 focus:ring-purple-500 font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-purple-200 mb-1.5">Xaqiiji Furaha Sirta ah</label>
                    <div class="relative">
                        <i class="fa-solid fa-check-double absolute left-3.5 top-1/2 -translate-y-1/2 text-[#736c82] text-xs"></i>
                        <input type="password" name="password_confirm" placeholder="Ku celi furahaaga" required
                               class="w-full bg-[#201c2c] border border-[#2e273f] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#736c82] focus:outline-none focus:ring-2 focus:ring-purple-500 font-semibold">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-extrabold text-xs transition duration-150 shadow-lg shadow-purple-500/25">
                    Sameyso Koonto (Sign Up)
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-[#9e9aa7] font-medium">
            Horay ma u lahayd koonto? 
            <a href="{% url 'login' %}" class="text-purple-300 font-bold hover:underline ml-1">Soo Gal (Log In)</a>
        </p>

    </div>

</body>
</html>
