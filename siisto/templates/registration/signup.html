<!DOCTYPE html>
<html lang="so" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siisto & Skillset — Is Diiwaangeli (Sign Up)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #080a0f;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 antialiased bg-[#080a0f]">

    <div class="w-full max-w-md space-y-6">
        
        <!-- LOGO -->
        <div class="text-center space-y-1">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 via-blue-500 to-cyan-400 flex items-center justify-center mx-auto shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-dumbbell text-white text-xl"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Siisto</h1>
            <p class="text-xs text-cyan-300 font-bold uppercase tracking-wider">AI Fitness & Pose Tracker</p>
        </div>

        <div class="bg-[#0e131f] border border-[#1d283e] rounded-3xl p-8 shadow-2xl space-y-6">
            <div>
                <h2 class="text-lg font-bold text-white">Sameyso Koonto Cusub</h2>
                <p class="text-xs text-[#94a3b8]">Ku soo biir Siisto si aad u hesho tababarkaaga AI.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="bg-rose-950/40 border border-rose-800 text-rose-300 p-3 rounded-2xl text-xs font-semibold">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'signup' %}" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1.5">Magaca (Username)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-[#64748b] text-xs"></i>
                        <input type="text" name="username" placeholder="Dooro magacaaga" required
                               class="w-full bg-[#141b2d] border border-[#1d283e] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#64748b] focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-blue-200">Gmail / Email</label>
                        <button type="button" onclick="document.getElementById('emailInput').value += (document.getElementById('emailInput').value.includes('@') ? '' : '@gmail.com')" class="text-[10px] text-cyan-400 hover:text-cyan-300 font-mono">+@gmail.com</button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-cyan-400 text-xs"></i>
                        <input type="email" id="emailInput" name="email" placeholder="tusaale@gmail.com" required
                               class="w-full bg-[#141b2d] border border-[#1d283e] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#64748b] focus:outline-none focus:ring-2 focus:ring-cyan-500 font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1.5">Furaha Sirta ah (Password)</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-[#64748b] text-xs"></i>
                        <input type="password" name="password" placeholder="Ugu yaraan 6 xaraf" required
                               class="w-full bg-[#141b2d] border border-[#1d283e] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#64748b] focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1.5">Xaqiiji Furaha Sirta ah</label>
                    <div class="relative">
                        <i class="fa-solid fa-check-double absolute left-3.5 top-1/2 -translate-y-1/2 text-[#64748b] text-xs"></i>
                        <input type="password" name="password_confirm" placeholder="Ku celi furahaaga" required
                               class="w-full bg-[#141b2d] border border-[#1d283e] rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-[#64748b] focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-extrabold text-xs transition duration-150 shadow-lg shadow-blue-500/30">
                    Sameyso Koonto (Sign Up)
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-[#94a3b8] font-medium">
            Horay ma u lahayd koonto? 
            <a href="{% url 'login' %}" class="text-cyan-300 font-bold hover:underline ml-1">Soo Gal (Log In)</a>
        </p>

    </div>

</body>
</html>
