<!DOCTYPE html>
<html lang="so" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siisto — Is Diiwaangeli (Sign Up)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a101d;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 240, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0, 163, 255, 0.1) 0%, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
        }
        .signup-card {
            background: rgba(13, 21, 39, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(0, 240, 255, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased">

    <div class="w-full max-w-md space-y-6">
        
        <!-- BRAND LOGO -->
        <div class="text-center space-y-1.5">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#00f0ff] to-[#00a3ff] text-[#0a101d] flex items-center justify-center mx-auto shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-dumbbell text-2xl"></i>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight">Siisto</h1>
            <p class="text-xs text-[#00f0ff] font-extrabold uppercase tracking-widest">Fitness &amp; AI Intelligence</p>
        </div>

        <div class="signup-card p-6 sm:p-8 space-y-6">
            <div>
                <h2 class="text-xl font-black text-white">Sameyso Koonto Cusub</h2>
                <p class="text-xs text-slate-400 mt-1">Ku soo biir Siisto si aad u hesho tababarkaaga AI.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="p-3.5 rounded-2xl text-xs font-bold flex items-center gap-2.5 {% if message.tags == 'error' %}bg-rose-950/60 text-rose-200 border border-rose-500/40{% else %}bg-[#111c33] text-[#00f0ff] border border-[rgba(0,240,255,0.3)]{% endif %}">
                    <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation text-rose-400{% else %}fa-circle-check text-[#00f0ff]{% endif %} text-sm flex-shrink-0"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'signup' %}" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">Magaca (Username)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" name="username" placeholder="Dooro magacaaga" required autofocus
                               class="w-full bg-[#0a101d] border border-[rgba(0,240,255,0.2)] rounded-xl pl-9 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#00f0ff] font-semibold">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-300">Gmail / Email</label>
                        <button type="button" onclick="document.getElementById('emailInput').value += (document.getElementById('emailInput').value.includes('@') ? '' : '@gmail.com')" class="text-[10px] text-[#00f0ff] hover:underline font-mono">+@gmail.com</button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="email" id="emailInput" name="email" placeholder="tusaale@gmail.com" required
                               class="w-full bg-[#0a101d] border border-[rgba(0,240,255,0.2)] rounded-xl pl-9 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#00f0ff] font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">Furaha Sirta ah (Password)</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="password" name="password" placeholder="Ugu yaraan 6 xaraf" required
                               class="w-full bg-[#0a101d] border border-[rgba(0,240,255,0.2)] rounded-xl pl-9 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#00f0ff] font-semibold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">Xaqiiji Furaha Sirta ah</label>
                    <div class="relative">
                        <i class="fa-solid fa-check-double absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="password" name="password_confirm" placeholder="Ku celi furahaaga" required
                               class="w-full bg-[#0a101d] border border-[rgba(0,240,255,0.2)] rounded-xl pl-9 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#00f0ff] font-semibold">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-[#00f0ff] to-[#00a3ff] hover:opacity-95 text-[#0a101d] font-black text-xs transition duration-150 shadow-lg shadow-cyan-500/30 flex items-center justify-center gap-2">
                    <span>Sameyso Koonto (Sign Up)</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-400 font-semibold">
            Horay ma u lahayd koonto? 
            <a href="{% url 'login' %}" class="text-[#00f0ff] font-bold hover:underline ml-1">Soo Gal (Log In) &rarr;</a>
        </p>

    </div>

</body>
</html>
